header:
  schema-version: 2.2.0
  last-updated: '2026-11-05'
  last-reviewed: '2026-11-05'
  url: https://raw.githubusercontent.com/wasmCloud/go/main/security-insights.yml
  project-si-source: https://raw.githubusercontent.com/wasmCloud/wasmCloud/main/security-insights.yml
  comment: >-
    Repository-level data for wasmCloud/go. Project-level data, including
    vulnerability reporting, is in the wasmCloud/wasmCloud file above.

repository:
  url: https://github.com/wasmCloud/go
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: wasmCloud Go maintainers (@wasmCloud/go-maintainers)
      social: https://github.com/wasmCloud/go/blob/main/MAINTAINERS.md#wasmcloudgo-maintainers
      primary: true
  license:
    url: https://github.com/wasmCloud/go/blob/main/LICENSE
    expression: Apache-2.0
  documentation:
    contributing-guide: https://github.com/wasmCloud/go/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/wasmCloud/go/blob/main/CONTRIBUTING.md#dependencies
    review-policy: https://github.com/wasmCloud/go/blob/main/CONTRIBUTING.md#submitting-changes
    governance: https://github.com/wasmCloud/wasmCloud/blob/main/GOVERNANCE.md
    security-policy: https://github.com/wasmCloud/.github/blob/main/SECURITY.md
  release:
    automated-pipeline: true
    distribution-points:
      - uri: https://github.com/wasmCloud/go/releases
        comment: GitHub Releases, tagged component/v<version>, cut by release-train.yaml and release-tag.yaml.
      - uri: https://pkg.go.dev/go.wasmcloud.dev/component
        comment: The go.wasmcloud.dev/component module, fetched through the Go module proxy and checked against the Go checksum database.
      - uri: https://github.com/wasmCloud/go/pkgs/container/go-airgap
        comment: ghcr.io/wasmcloud/go-airgap image with the pinned toolchain for offline builds, published on each component/v* tag with a signed build provenance attestation.
    changelog: https://github.com/wasmCloud/go/releases
  security:
    assessments:
      self:
        name: wasmCloud Go security self-assessment
        evidence: https://github.com/wasmCloud/go/blob/main/SECURITY_ASSESSMENT.md
        date: '2026-11-05'
        comment: >-
          Covers this repository's SDKs, CI and releases, and the risks users
          inherit from the SDK toolchain and the examples. The host sandbox the
          components run in is covered by the wasmCloud self-assessment and
          its threat model, THREAT_MODEL.md in wasmCloud/wasmCloud.
    tools:
      - name: CodeQL
        type: SAST
        comment: >-
          Analyzes the component and plugin SDKs on every pull request, on
          pushes to main and weekly.
          A pull request that adds a high or critical severity alert is blocked
          from merging; see CONTRIBUTING.md#code-scanning.
        rulesets:
          - security-extended
        integration:
          adhoc: false
          ci: true
          release: false
        results:
          ci:
            name: CodeQL analysis
            predicate-uri: https://codeql.github.com
            location: https://github.com/wasmCloud/go/security/code-scanning
      - name: Dependabot
        type: SCA
        comment: >-
          Dependabot alerts and security-update PRs for Go modules and GitHub
          Actions, plus weekly version updates for GitHub Actions. Renovate
          proposes Go module version updates.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
      - name: Renovate
        type: SCA
        comment: Go module updates, including indirect dependencies.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results:
          adhoc:
            name: Renovate
            predicate-uri: https://docs.renovatebot.com
            location: https://github.com/wasmCloud/go/actions/workflows/renovate.yaml
      - name: GitHub secret scanning
        type: secret
        comment: >-
          Secret scanning and push protection are enabled on the repository,
          so a push containing a detected secret is blocked.
        rulesets:
          - default
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: GitHub secret scanning
            predicate-uri: https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning
            location: https://github.com/wasmCloud/wasmCloud/blob/main/SECURITY.md#stored-secrets
      - name: OSPS Baseline Scanner (grc.store)
        type: other
        comment: >-
          OSPS Baseline Maturity Level 2 assessment weekly and on demand,
          published to grc.store as a signed log by the publish-results
          workflow.
        rulesets:
          - osps-baseline
        integration:
          adhoc: true
          ci: true
          release: false
        results:
          ci:
            name: OSPS Baseline evaluation
            predicate-uri: https://github.com/revanite-io/pvtr-publish-results
            location: https://grc.store/targets/wasmcloud/go
