name: Air-gapped build

# Proves the examples build with only the versions documented in BUILDING.md,
# and nothing else. The build itself runs with `--network none`, so anything
# the toolchain tries to download is a hard failure rather than a slow success.
#
# This does not replace Component / Go: that workflow runs live smoke tests
# against NATS and `wash dev`. This one is build-only and answers a different
# question — can someone offline build this at all.

# NOTE: the push paths and the `changes` filter are duplicated on purpose —
# GitHub Actions does not support YAML anchors, so they have to be kept in sync
# by hand.
on:
  push:
    branches: ["main"]
    # A release tag re-runs the whole suite and publishes the image: it is the
    # first moment the release's SDK version can actually be downloaded.
    # (Path filters do not apply to tag pushes.)
    tags: ["component/v*"]
    paths:
      - ".github/workflows/airgapped.yaml"
      - "airgap/**"
      - "BUILDING.md"
      - "Makefile"
      - "component/**"
      - "examples/components/**"
      - "templates/**"
  # Runs on every pull request so the required `airgapped-gate` check always
  # reports; the `changes` job skips the build when none of the paths changed.
  pull_request:
    branches: ["main"]
  # The pinned toolchain is fetched from GitHub Releases, which can be re-cut
  # under us. A weekly run catches that without waiting for a code change.
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  # Pull requests only: on a push there is no checkout for paths-filter to diff
  # in, and the push trigger's own path filter already did this job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      airgap: ${{ steps.filter.outputs.airgap }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            airgap:
              - ".github/workflows/airgapped.yaml"
              - "airgap/**"
              - "BUILDING.md"
              - "Makefile"
              - "component/**"
              - "examples/components/**"
              - "templates/**"

  # Cheap and fast: catches BUILDING.md drifting from reality without building
  # anything. Runs first so a stale doc fails in seconds, not minutes.
  #
  # Every job below `changes` checks its needs' results itself: a job whose
  # chain includes a skipped `changes` would otherwise be skipped too.
  versions:
    name: Version drift
    runs-on: ubuntu-latest
    needs: release-state
    if: ${{ !cancelled() && needs.release-state.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          # check-versions.sh resolves the SDK version from the newest
          # component/* tag, so a shallow clone without tags would report drift.
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: component/go.mod
          cache: false
      - name: Check pinned versions against their sources
        env:
          ALLOW_PENDING_SDK_RELEASE: ${{ needs.release-state.outputs.pending == 'true' && '1' || '' }}
        run: make airgap-versions

  # A release pins an SDK version before it is tagged: on the release PR, and on
  # main until release-tag.yaml pushes the tag. Only then may the version check
  # accept an untagged SDK_VERSION, and the offline build be skipped — it seeds
  # the image by downloading that version, which is impossible until the tag
  # exists. The tag push runs the build.
  #
  # "Release" is decided here, not by branch name, since anyone can name a
  # branch. It is either a push to main (already reviewed), or a PR that is all
  # of: opened by a bot (the release train's app), from this repository, from a
  # release/component/ branch, and changing nothing but what airgap/bump-sdk.sh
  # changes. Anything else stays strict: an untagged SDK_VERSION fails the
  # version check and the build still runs. The weekly run is always strict, so
  # a release that never got tagged surfaces.
  release-state:
    name: SDK release state
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.airgap == 'true') }}
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.state.outputs.pending }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          # The PR merge commit's first parent, for the changed-files check.
          fetch-depth: 2
      - id: state
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          version=$(. airgap/versions.env && echo "$SDK_VERSION")
          if git ls-remote --exit-code --tags origin "refs/tags/component/${version}" >/dev/null; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trusted=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            trusted=true
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [[ "$HEAD_REF" == release/component/* ]] &&
               [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] &&
               [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            unexpected=$(git diff --name-only HEAD^1 HEAD | grep -vE \
              '^(airgap/versions\.env|BUILDING\.md|examples/components/.+/go\.(mod|sum)|templates/[^/]+/go\.mod)$' || true)
            if [ -z "$unexpected" ]; then
              trusted=true
            else
              echo "::warning::release PR changes files outside a version bump, so it is checked strictly:"
              printf '%s\n' "$unexpected"
            fi
          fi

          if [ "$trusted" = "true" ]; then
            echo "::notice::component/${version} is not tagged yet; accepting it as a pending release and skipping the offline build until release-tag.yaml pushes the tag."
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds (or pulls) the toolchain image once and hands it to every matrix leg
  # as an artifact, so the seed stage's downloads happen once per run rather
  # than once per example. Also discovers the module list, so a new example is
  # covered without editing this file.
  image:
    name: Prepare air-gapped image
    runs-on: ubuntu-latest
    needs: [versions, release-state]
    if: ${{ !cancelled() && needs.versions.result == 'success' && needs.release-state.outputs.pending != 'true' }}
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Discover modules
        id: modules
        run: |
          echo "modules=$(find examples/components templates -name go.mod -exec dirname {} \; | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

      # The image is tagged by a hash of airgap/versions.env and every
      # example's go.mod and go.sum (airgap/image-tag.sh), so a cache miss means
      # the pinned version set or a module's dependencies changed — which is
      # exactly when we want a fresh image rather than a stale one.
      #
      # The owner has to be lowercased: Docker repository names must be
      # lowercase and this org is `wasmCloud`. Computed rather than hardcoded so
      # the workflow still works in a fork.
      - name: Resolve image name and tag
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/go-airgap" >> "$GITHUB_OUTPUT"
          echo "tag=$(bash airgap/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Pull published image
        id: pull
        continue-on-error: true
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAG: ${{ steps.img.outputs.tag }}
        run: docker pull "$IMAGE:$TAG"

      # Falls back to building locally when nothing is published for this
      # version set yet (a PR that bumps a version, or the very first run).
      - name: Build image
        if: steps.pull.outcome != 'success'
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        run: make airgap-image AIRGAP_IMAGE="$IMAGE"

      - name: Export image
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAG: ${{ steps.img.outputs.tag }}
        run: docker save "$IMAGE:$TAG" | zstd -T0 -3 -o airgap-image.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airgap-image
          path: airgap-image.tar.zst
          retention-days: 1
          compression-level: 0

  # One leg per example, each in its own `--network none` container started
  # from the image exactly as shipped: no example can lean on something another
  # one's build left behind, and a failure names the example it belongs to.
  build:
    name: Offline (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: image
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.image.outputs.modules) }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: airgap-image

      - name: Load image
        run: zstd -d -c airgap-image.tar.zst | docker load && rm airgap-image.tar.zst

      - name: Resolve image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/go-airgap" >> "$GITHUB_OUTPUT"

      # wit/deps is not checked in. This is the one step with a network, and
      # it uses the image's pinned wash rather than installing one.
      - name: Fetch WIT dependencies
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          MODULE: ${{ matrix.module }}
        run: make airgap-fetch AIRGAP_IMAGE="$IMAGE" AIRGAP_MODULES="$MODULE"

      # airgap-run, not airgap-test: the latter depends on airgap-image and
      # would rebuild the image we just loaded.
      - name: Build with no network
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          MODULE: ${{ matrix.module }}
        run: make airgap-run AIRGAP_IMAGE="$IMAGE" AIRGAP_MODULES="$MODULE"

  # The required check for this workflow. It runs even when a job above fails
  # or is skipped, and fails if any of them failed. A release PR skips the
  # image and the build, and passes.
  airgapped-gate:
    needs: [changes, release-state, versions, image, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Publishes the image so PR runs pull instead of rebuilding. Only from main
  # and the weekly run — never from a pull request, which cannot be trusted
  # with a write token.
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Resolve image name and tag
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/go-airgap" >> "$GITHUB_OUTPUT"
          echo "tag=$(bash airgap/image-tag.sh)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          IMAGE: ${{ steps.img.outputs.name }}
          TAG: ${{ steps.img.outputs.tag }}
        run: |
          make airgap-image AIRGAP_IMAGE="$IMAGE"
          docker push "$IMAGE:$TAG"
          # A moving tag for humans; the hash tag is what CI resolves.
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push "$IMAGE:latest"
