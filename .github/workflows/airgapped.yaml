name: Air-gapped build

# Proves the examples build with only the versions documented in BUILDING.md,
# and nothing else. The build itself runs with `--network none`, so anything
# the toolchain tries to download is a hard failure rather than a slow success.
#
# This does not replace Component / Go: that workflow runs live smoke tests
# against NATS and `wash dev`. This one is build-only and answers a different
# question — can someone offline build this at all.

# NOTE: the two path lists are duplicated on purpose — GitHub Actions does not
# support YAML anchors, so they have to be kept in sync by hand.
on:
  push:
    branches: ["main"]
    # A release tag re-runs the whole suite and publishes the image: it is the
    # first moment the release's SDK version can actually be downloaded.
    # (Path filters do not apply to tag pushes.)
    tags: ["component/v*"]
    paths:
      - ".github/workflows/airgapped.yaml"
      - "airgap/**"
      - "BUILDING.md"
      - "Makefile"
      - "component/**"
      - "examples/components/**"
      - "templates/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/airgapped.yaml"
      - "airgap/**"
      - "BUILDING.md"
      - "Makefile"
      - "component/**"
      - "examples/components/**"
      - "templates/**"
  # The pinned toolchain is fetched from GitHub Releases, which can be re-cut
  # under us. A weekly run catches that without waiting for a code change.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  # Cheap and fast: catches BUILDING.md drifting from reality without building
  # anything. Runs first so a stale doc fails in seconds, not minutes.
  versions:
    name: Version drift
    runs-on: ubuntu-latest
    needs: release-state
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # check-versions.sh resolves the SDK version from the newest
          # component/* tag, so a shallow clone without tags would report drift.
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: component/go.mod
          cache: false
      - name: Check pinned versions against their sources
        env:
          ALLOW_PENDING_SDK_RELEASE: ${{ needs.release-state.outputs.pending == 'true' && '1' || '' }}
        run: make airgap-versions

  # A release pins an SDK version before it is tagged: on the release PR, and on
  # main until release-tag.yaml pushes the tag. Only then may the version check
  # accept an untagged SDK_VERSION, and the offline build be skipped — it seeds
  # the image by downloading that version, which is impossible until the tag
  # exists. The tag push runs the build.
  #
  # "Release" is decided here, not by branch name, since anyone can name a
  # branch. It is either a push to main (already reviewed), or a PR that is all
  # of: opened by a bot (the release train's app), from this repository, from a
  # release/component/ branch, and changing nothing but what airgap/bump-sdk.sh
  # changes. Anything else stays strict: an untagged SDK_VERSION fails the
  # version check and the build still runs. The weekly run is always strict, so
  # a release that never got tagged surfaces.
  release-state:
    name: SDK release state
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.state.outputs.pending }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The PR merge commit's first parent, for the changed-files check.
          fetch-depth: 2
      - id: state
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          version=$(. airgap/versions.env && echo "$SDK_VERSION")
          if git ls-remote --exit-code --tags origin "refs/tags/component/${version}" >/dev/null; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          trusted=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            trusted=true
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] &&
               [[ "$HEAD_REF" == release/component/* ]] &&
               [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] &&
               [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            unexpected=$(git diff --name-only HEAD^1 HEAD | grep -vE \
              '^(airgap/versions\.env|BUILDING\.md|examples/components/.+/go\.(mod|sum)|templates/[^/]+/go\.mod)$' || true)
            if [ -z "$unexpected" ]; then
              trusted=true
            else
              echo "::warning::release PR changes files outside a version bump, so it is checked strictly:"
              printf '%s\n' "$unexpected"
            fi
          fi

          if [ "$trusted" = "true" ]; then
            echo "::notice::component/${version} is not tagged yet; accepting it as a pending release and skipping the offline build until release-tag.yaml pushes the tag."
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build all examples offline
    runs-on: ubuntu-latest
    needs: [versions, release-state]
    if: needs.release-state.outputs.pending != 'true'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # The image is tagged by a hash of airgap/versions.env, so a cache miss
      # means the pinned version set changed — which is exactly when we want a
      # fresh image rather than a stale one.
      #
      # The owner has to be lowercased: Docker repository names must be
      # lowercase and this org is `wasmCloud`. Computed rather than hardcoded so
      # the workflow still works in a fork.
      - name: Resolve image name and tag
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/go-airgap" >> "$GITHUB_OUTPUT"
          echo "tag=$(sha256sum airgap/versions.env | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Pull published image
        id: pull
        continue-on-error: true
        run: docker pull "${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}"

      # Falls back to building locally when nothing is published for this
      # version set yet (a PR that bumps a version, or the very first run).
      - name: Build image
        if: steps.pull.outcome != 'success'
        run: make airgap-image AIRGAP_IMAGE="${{ steps.img.outputs.name }}"

      # wit/deps is not checked in. This is the one step with a network, and
      # it uses the image's pinned wash rather than installing one.
      - name: Fetch WIT dependencies
        run: make airgap-fetch AIRGAP_IMAGE="${{ steps.img.outputs.name }}"

      # airgap-run, not airgap-test: the latter depends on airgap-image and
      # would rebuild the image we just pulled.
      - name: Build every example with no network
        run: make airgap-run AIRGAP_IMAGE="${{ steps.img.outputs.name }}"

  # Publishes the image so PR runs pull instead of rebuilding. Only from main
  # and the weekly run — never from a pull request, which cannot be trusted
  # with a write token.
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Resolve image name and tag
        id: img
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/go-airgap" >> "$GITHUB_OUTPUT"
          echo "tag=$(sha256sum airgap/versions.env | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          make airgap-image AIRGAP_IMAGE="${{ steps.img.outputs.name }}"
          docker push "${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}"
          # A moving tag for humans; the hash tag is what CI resolves.
          docker tag "${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}" "${{ steps.img.outputs.name }}:latest"
          docker push "${{ steps.img.outputs.name }}:latest"
