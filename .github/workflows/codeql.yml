name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.27"
          cache-dependency-path: |
            component/go.sum
            plugin/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      # The SDKs only compile for the wasm target. Both builds are traced into
      # the same database.
      - name: Build SDK
        working-directory: ./component
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      - name: Build plugin SDK
        working-directory: ./plugin
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:go"
