name: zizmor

# Audits the GitHub Actions workflows and uploads the findings to code
# scanning, where they show on pull requests and in the Security tab.

on:
  # Every pull request, not only those that change .github/**, so the check
  # can be required.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly Monday at 08:47 UTC, for audits that use online data.
    - cron: '47 8 * * 1'

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploads the findings as SARIF to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        env:
          # For online audits, such as checking a pinned SHA against its tag.
          GH_TOKEN: ${{ github.token }}
