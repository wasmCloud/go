name: Templates

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/templates-go.yaml"
      - "templates/**"
  # Runs on every pull request so the required `templates-gate` check always
  # reports; the `changes` job skips the build when none of the paths changed.
  pull_request:
    branches: ["main"]

env:
  GO_VERSION: "1.27"

permissions:
  contents: read

jobs:
  # Pull requests only: on a push there is no checkout for paths-filter to diff
  # in, and the push trigger's own path filter already did this job.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            templates:
              - ".github/workflows/templates-go.yaml"
              - "templates/**"

  component:
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.templates == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        template-name:
          - http-hello-world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Full history so Go can resolve the SDK from this checkout below.
          fetch-depth: 0
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: wasmcloud/setup-wash-action@v2.1.0

      # `wash new` runs the template's `go mod tidy` before the replace below
      # can be applied, and the template has no go.sum, so the SDK version it
      # pins must be downloadable. On a release PR it is not tagged yet: tag it
      # locally and resolve it from this checkout, as the release train does
      # (airgap/local-sdk-env.sh). A no-op once the tag exists.
      - name: Resolve an untagged release SDK from this checkout
        run: |
          set -euo pipefail
          version=$(. airgap/versions.env && echo "$SDK_VERSION")
          tag="component/${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            exit 0
          fi
          echo "::notice::${tag} is not tagged yet; resolving it from this checkout."
          git tag "$tag" HEAD
          . airgap/local-sdk-env.sh
          local_sdk_env "$GITHUB_WORKSPACE"
          for var in GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 GOPRIVATE; do
            echo "${var}=${!var}" >> "$GITHUB_ENV"
          done

      - name: Generate project from template
        run: |
          wash new "file://${{ github.workspace }}" \
            --name test-component \
            --subfolder templates/${{ matrix.template-name }}
          test -f test-component/go.mod

      # Test the template against the SDK in this checkout rather than the
      # released module, mirroring what the examples job does.
      - name: Use in-repo SDK
        working-directory: test-component
        run: |
          go mod edit -replace go.wasmcloud.dev/component=${{ github.workspace }}/component
          go mod tidy

      - name: Build project
        working-directory: test-component
        run: wash build

  # The required check for this workflow. It runs even when a job above fails
  # or is skipped, and fails if any of them failed.
  templates-gate:
    needs: [changes, component]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
