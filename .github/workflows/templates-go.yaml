name: Templates

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/templates-go.yaml"
      - "templates/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/templates-go.yaml"
      - "templates/**"

env:
  GO_VERSION: "1.25"

permissions:
  contents: read

jobs:
  component:
    strategy:
      fail-fast: false
      matrix:
        template-name:
          - http-hello-world
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: wasmcloud/setup-wash-action@v2.1.0

      - name: Generate project from template
        run: |
          wash new "file://${{ github.workspace }}" \
            --name test-component \
            --subfolder templates/${{ matrix.template-name }}

      - name: Build project
        working-directory: test-component
        run: wash build
