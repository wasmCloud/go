name: Component / Go

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/component-go.yaml"
      - "component/**"
      - "examples/components/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/component-go.yaml"
      - "component/**"
      - "examples/components/**"

env:
  GO_VERSION: "1.25"
  # Only used by the nats examples, which need a real server to talk to.
  NATS_SERVER_VERSION: "2.14.5"
  NATSCLI_VERSION: "0.3.1"

permissions:
  contents: read

jobs:
  sdk:
    name: SDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: component/go.sum
      # Generated bindings only compile for the wasm target.
      - name: Build SDK
        working-directory: ./component
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      # The generated componentize-go bindings trip the unsafeptr and
      # composites analyzers, so only handwritten packages are vetted; the
      # generated ones are still compile-checked by the build step above.
      - name: Vet SDK
        working-directory: ./component
        run: GOOS=wasip1 GOARCH=wasm go vet $(go list ./... | grep -vE '/(imports|exports)/')

  examples:
    name: Example (${{ matrix.example.folder }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - folder: http-server
            test-command: curl -sf 127.0.0.1:8000/ && curl -sf -X POST -d 'ping' 127.0.0.1:8000/post
          - folder: http-client
            test-command: curl -sf 127.0.0.1:8000/
          # The checker requires >= 60 bits of entropy, so the smoke test
          # needs a genuinely strong password ("hunter2" scores ~36 and
          # is rejected with a 400).
          - folder: http-password-checker
            test-command: curl -sf -X POST 127.0.0.1:8000/api/v1/check -d '{"value":"Tr0ub4dor&3xplor3r!"}'
          - folder: http-keyvalue-crud
            test-command: curl -sf -X POST 127.0.0.1:8000/crud/ci -d '{"a":"b"}' && curl -sf 127.0.0.1:8000/crud/ci && curl -sf -X DELETE 127.0.0.1:8000/crud/ci
          - folder: http-p3-streaming
            test-command: test "$(curl -sf -X POST --data-binary 'echo' 127.0.0.1:8000/echo)" = "echo"
          # Build-only: released wash does not serve wasi:otel yet; drop
          # skip-dev-test once a wash release ships the wasi_otel plugin.
          - folder: http-otel
            skip-dev-test: true
            test-command: "true"

          # Two separate blockers, each with its own escape hatch:
          #
          # skip-fetch: `wasmcloud:nats` is not published to a component
          # registry, so the vendored wit/deps is all there is and `wash build`
          # fails resolving the package. Drop it once the package is published.
          #
          # skip-dev-test: no released wash serves `wasmcloud:nats` — the
          # plugin is still unmerged (wasmCloud/wasmCloud#5494), so v2.8.0
          # starts these workloads with "no plugins found for requested
          # interfaces" and every smoke test times out. Build-only until a
          # release ships it; same treatment as http-otel above. Drop
          # skip-dev-test from all three together and the harness below runs
          # them unchanged.
          #
          # The nats-setup blocks are kept for that day: each one is the
          # README's prerequisite section, since streams and buckets are the
          # operator's to create, never the component's.
          - folder: nats-stream-replay
            skip-fetch: true
            skip-dev-test: true
            nats-setup: |
              nats stream add EVENTS --subjects 'events.>' \
                --storage file --retention limits --discard old \
                --max-msgs=-1 --max-bytes=-1 --max-age=24h --replicas 1 --defaults
              # Explicit ack: the drain endpoint settles each message itself.
              nats consumer add EVENTS workers --pull --ack explicit \
                --deliver all --max-deliver 5 --wait 30s --defaults
              # Seeded before the component starts; the reads below consume
              # nothing, so the smoke test stays safe to retry.
              nats pub events.one 'colour=blue'
              nats pub events.two 'size=large'
            test-command: curl -sf 127.0.0.1:8000/streams/EVENTS/messages/1 && curl -sf '127.0.0.1:8000/streams/EVENTS/replay?from=1&count=2'

          # No HTTP: driven by the stream, asserted through the KV bucket. The
          # subscription is `deliver all`, so seeding before the component
          # starts still reaches it, which keeps the assertion read-only and
          # therefore retry-safe.
          - folder: nats-jetstream-orders
            skip-fetch: true
            skip-dev-test: true
            nats-setup: |
              nats stream add ORDERS --subjects 'orders.received' \
                --storage file --retention limits --discard old \
                --max-msgs=-1 --max-bytes=-1 --max-age=24h \
                --dupe-window=2m --replicas 1 --defaults
              nats stream add PROCESSED --subjects 'orders.processed' \
                --storage file --dupe-window=5m --replicas 1 --defaults
              nats kv add order-totals --history 5
              nats pub orders.received 'order-1:100'
              nats pub orders.received 'order-1:50'
            # 100 + 50. The stored value is total@last-applied-sequence; only
            # the total is asserted, so this does not pin the stream position.
            test-command: nats kv get order-totals order-1 --raw | grep -q '^150@'

          # No HTTP either, but a watcher only sees changes made while it is
          # running, so the write has to happen inside the smoke test. Putting
          # the same key/value each attempt keeps it retry-safe.
          - folder: nats-kv-watch
            skip-fetch: true
            skip-dev-test: true
            nats-setup: |
              nats kv add feature-flags --history 5
            test-command: nats kv put feature-flags flag.dark-mode on >/dev/null && sleep 2 && test "$(nats kv get feature-flags active --raw)" = "dark-mode"

          # Build-only: this example is two components in two `wash dev`
          # sessions (the gateway fronts the service over NATS), which the
          # single-component harness below cannot express. Exercising it needs
          # a second dev session and a teardown case for the 503 path.
          - folder: nats-request-reply/service
            skip-fetch: true
            skip-dev-test: true
            test-command: "true"
          - folder: nats-request-reply/gateway
            skip-fetch: true
            skip-dev-test: true
            test-command: "true"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: wasmcloud/setup-wash-action@v2.1.0

      # The checked-in go.mod points at the released SDK so the examples build
      # for anyone who clones or copies them. CI needs the opposite: build
      # against the SDK in this checkout, so a regression surfaces here rather
      # than after the next tag.
      - name: Use in-repo SDK
        working-directory: examples/components/${{ matrix.example.folder }}
        run: |
          go mod edit -replace go.wasmcloud.dev/component=${{ github.workspace }}/component
          # proxy.golang.org intermittently cuts a module zip mid-transfer
          # (the download dies with an HTTP/2 INTERNAL_ERROR), which fails one
          # matrix leg while the rest of the run fetches the same module fine.
          # Retry before giving up so a bad moment upstream is not a red build.
          for attempt in 1 2 3; do
            if go mod tidy; then exit 0; fi
            echo "::warning::go mod tidy failed (attempt $attempt/3), retrying" >&2
            sleep 10
          done
          exit 1

      # Installed into RUNNER_TEMP rather than /usr/local/bin so no step needs
      # sudo; GITHUB_PATH puts it on PATH for the smoke test, and the export
      # covers the nats-setup block running inside this step.
      - name: Start NATS
        if: ${{ matrix.example.nats-setup && !matrix.example.skip-dev-test }}
        run: |
          BIN="$RUNNER_TEMP/nats-bin"
          mkdir -p "$BIN"
          curl -sfL "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C "$BIN" --wildcards '*/nats-server'
          curl -sfL "https://github.com/nats-io/natscli/releases/download/v${NATSCLI_VERSION}/nats-${NATSCLI_VERSION}-linux-amd64.zip" \
            -o "$RUNNER_TEMP/natscli.zip"
          unzip -j -o "$RUNNER_TEMP/natscli.zip" '*/nats' -d "$BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          export PATH="$BIN:$PATH"

          nats-server -js -sd "$RUNNER_TEMP/jetstream" &
          for i in $(seq 1 30); do
            nats --timeout=1s server check connection && break
            sleep 1
          done
          nats --timeout=5s server check jetstream

          ${{ matrix.example.nats-setup }}

      - name: Build component
        working-directory: examples/components/${{ matrix.example.folder }}
        run: wash build ${{ matrix.example.skip-fetch && '--skip-fetch' || '' }}

      - name: Smoke test with wash dev
        if: ${{ !matrix.example.skip-dev-test }}
        working-directory: examples/components/${{ matrix.example.folder }}
        run: |
          wash dev --non-interactive &
          DEV_PID=$!
          # wash serves HTTP before the component is deployed (requests fail
          # with "no workload registered"), so waiting for the port to open is
          # not enough: retry the actual test until the component responds.
          smoke_test() {
            ${{ matrix.example.test-command }}
          }
          ok=""
          for i in $(seq 1 60); do
            sleep 2
            if smoke_test; then ok=1; break; fi
          done
          kill $DEV_PID || true
          if [ -z "$ok" ]; then
            echo "Smoke test did not pass within 120s" >&2
            exit 1
          fi
