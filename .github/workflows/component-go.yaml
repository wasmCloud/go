name: Component / Go

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/component-go.yaml"
      - "component/**"
      - "examples/components/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/component-go.yaml"
      - "component/**"
      - "examples/components/**"

env:
  GO_VERSION: "1.25"

permissions:
  contents: read

jobs:
  sdk:
    name: SDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: component/go.sum
      # Generated bindings only compile for the wasm target.
      - name: Build SDK
        working-directory: ./component
        run: GOOS=wasip1 GOARCH=wasm go build ./...
      # The generated componentize-go bindings trip the unsafeptr and
      # composites analyzers, so only handwritten packages are vetted; the
      # generated ones are still compile-checked by the build step above.
      - name: Vet SDK
        working-directory: ./component
        run: GOOS=wasip1 GOARCH=wasm go vet $(go list ./... | grep -vE '/(imports|exports)/')

  examples:
    name: Example (${{ matrix.example.folder }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - folder: http-server
            test-command: curl -sf 127.0.0.1:8000/ && curl -sf -X POST -d 'ping' 127.0.0.1:8000/post
          - folder: http-client
            test-command: curl -sf 127.0.0.1:8000/
          # The checker requires >= 60 bits of entropy, so the smoke test
          # needs a genuinely strong password ("hunter2" scores ~36 and
          # is rejected with a 400).
          - folder: http-password-checker
            test-command: curl -sf -X POST 127.0.0.1:8000/api/v1/check -d '{"value":"Tr0ub4dor&3xplor3r!"}'
          - folder: http-keyvalue-crud
            test-command: curl -sf -X POST 127.0.0.1:8000/crud/ci -d '{"a":"b"}' && curl -sf 127.0.0.1:8000/crud/ci && curl -sf -X DELETE 127.0.0.1:8000/crud/ci
          - folder: http-p3-streaming
            test-command: test "$(curl -sf -X POST --data-binary 'echo' 127.0.0.1:8000/echo)" = "echo"
          # Build-only: released wash does not serve wasi:otel yet; drop
          # skip-dev-test once a wash release ships the wasi_otel plugin.
          - folder: http-otel
            skip-dev-test: true
            test-command: "true"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: wasmcloud/setup-wash-action@v2.1.0

      - name: Build component
        working-directory: examples/components/${{ matrix.example.folder }}
        run: wash build

      - name: Smoke test with wash dev
        if: ${{ !matrix.example.skip-dev-test }}
        working-directory: examples/components/${{ matrix.example.folder }}
        run: |
          wash dev --non-interactive &
          DEV_PID=$!
          # wash serves HTTP before the component is deployed (requests fail
          # with "no workload registered"), so waiting for the port to open is
          # not enough: retry the actual test until the component responds.
          smoke_test() {
            ${{ matrix.example.test-command }}
          }
          ok=""
          for i in $(seq 1 60); do
            sleep 2
            if smoke_test; then ok=1; break; fi
          done
          kill $DEV_PID || true
          if [ -z "$ok" ]; then
            echo "Smoke test did not pass within 120s" >&2
            exit 1
          fi
