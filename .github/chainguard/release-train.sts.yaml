# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

issuer: https://token.actions.githubusercontent.com
subject: repo:wasmCloud/go:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: wasmCloud/go/.github/workflows/release-train.yaml@refs/heads/main

# Push the release branch and open its PR. An app token, unlike GITHUB_TOKEN,
# lets that push and PR trigger CI.
permissions:
  contents: write
  pull_requests: write
