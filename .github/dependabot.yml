version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Conventional Commits, as commitlint requires: `chore(deps): bump ...`.
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Each group batches its kind of update into a single PR.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  # commitlint, pinned for the commitlint workflow.
  - package-ecosystem: "npm"
    directory: "/.github/commitlint"
    # Conventional Commits, as commitlint requires: `chore(deps): bump ...`.
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      commitlint:
        applies-to: version-updates
        patterns:
          - "*"

  # Version updates, including indirect dependencies, batched by family, and
  # security updates batched into a single PR per advisory.
  - package-ecosystem: "gomod"
    directories:
      - "/component"
      - "/plugin"
      - "/templates/http-hello-world"
      - "/examples/components/http-client"
      - "/examples/components/http-keyvalue-crud"
      - "/examples/components/http-otel"
      - "/examples/components/http-p3-streaming"
      - "/examples/components/http-password-checker"
      - "/examples/components/http-server"
      - "/examples/components/nats-jetstream-orders"
      - "/examples/components/nats-kv-watch"
      - "/examples/components/nats-request-reply/gateway"
      - "/examples/components/nats-request-reply/service"
      - "/examples/components/nats-stream-replay"
      - "/scripts/bench/httpbench"
    # Conventional Commits, as commitlint requires: `chore(deps): bump ...`.
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    allow:
      - dependency-type: "all"
    groups:
      golang-x:
        applies-to: version-updates
        patterns:
          - "golang.org/x/*"
      opentelemetry-go:
        applies-to: version-updates
        patterns:
          - "go.opentelemetry.io/otel"
          - "go.opentelemetry.io/otel/*"
      genproto:
        applies-to: version-updates
        patterns:
          - "google.golang.org/genproto/googleapis/*"
      go-modules:
        applies-to: version-updates
        patterns:
          - "*"
      go-security:
        applies-to: security-updates
        patterns:
          - "*"
