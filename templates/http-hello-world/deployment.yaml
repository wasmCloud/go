apiVersion: v1
kind: Service
metadata:
  name: {{project-name}}
spec:
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: {{project-name}}
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: {{project-name}}
      components:
        - name: {{project-name}}
          image: ghcr.io/[your-org]/{{project-name}}:0.1.0
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: localhost
