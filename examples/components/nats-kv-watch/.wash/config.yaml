build:
  # `-w` is required: this component serves no HTTP and declares its own
  # world. `wasmcloud:nats` is async throughout, so the result is a WASI P3
  # component — componentize-go selects a Go toolchain with async support.
  command: go tool componentize-go -w 'wasmcloud:examples/nats-kv-watch@0.1.0' build -o build/nats_kv_watch.wasm
  component_path: build/nats_kv_watch.wasm

# See the note in nats-stream-replay/.wash/config.yaml: this mirrors
# deployment.yaml's hostInterfaces for `wash dev`.
dev:
  host_interfaces:
    - namespace: wasmcloud
      package: nats
      version: 0.1.0
      interfaces: [types, kv, core, kv-handler]
      config:
        servers: nats://127.0.0.1:4222
        bucket-allow: feature-flags
        subject-allow: flags.changed
        kv-watches: feature-flags:flag.>
