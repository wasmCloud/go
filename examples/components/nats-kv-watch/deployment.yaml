# Deploys the watcher on wasmCloud v2. Needs a runtime >= 2.7.0: this
# manifest uses `maxConcurrency`, which 2.6.x rejects outright.
#
#   kubectl apply -f deployment.yaml
#
# What is *not* here is the point. A `wash host` plugin entry (`id:
# wasmcloud-nats`) defaults to `workloadConfig: deny`, which splits a binding
# in two: the host declares what it is — servers, credentials, TLS, and the subject,
# stream, and bucket grants — and the workload declares only what it wants
# delivered within that grant. A manifest that sets `servers`, `creds`,
# `tls-*`, or a `*-allow` is refused at bind, so a workload can ask for a
# capability but never widen one.
#
# The operator side of this example lives in the README, under "Declaring the
# binding host-side". `wash dev` defaults the other way round (`allow`), so
# `.wash/config.yaml` still carries the whole binding and a checkout stays
# runnable on its own.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: nats-kv-watch
spec:
  replicas: 1
  template:
    spec:
      components:
        - name: watcher
          image: ghcr.io/[your-org]/nats-kv-watch:0.1.0
          maxConcurrency: 4
          poolSize: 1
      hostInterfaces:
        # wasi:logging is a host plugin like any other: a component that
        # imports it and does not declare it here fails to start with
        # "a matching implementation was not found in the linker". `wash
        # dev` derives this entry from the component's imports, so the
        # omission only shows up on a real host.
        - namespace: wasi
          package: logging
          interfaces: [logging]
        - namespace: wasmcloud
          package: nats
          version: "0.1.0"
          interfaces: [types, kv, core, kv-handler]
          config:
            # bucket:filter, comma separated. This is an ask, not a grant:
            # the bucket has to be in the host's `bucket-allow` before this
            # can name it, and naming it here reaches nothing extra.
            #
            # The filter is the loop guard that matters: the component writes
            # `active` into this same bucket, and delivering that write back
            # would make every change trigger another one.
            kv-watches: feature-flags:flag.>
