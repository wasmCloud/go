build:
  # GOFLAGS selects go.bytecodealliance.org/pkg/wasihttp's async WASI P3
  # implementation. componentize-go main emits the componentizego_async tag
  # automatically for async worlds (bytecodealliance/componentize-go#71);
  # drop the env prefix once a release after v0.4.1 ships and the tool
  # pin in go.mod is bumped to it.
  command: GOFLAGS=-tags=componentizego_async go tool componentize-go -w wasmcloud:component-go/wasip3@0.2.0 build -o build/http_p3_streaming.wasm
  component_path: build/http_p3_streaming.wasm
workload:
  allowedHosts:
    - dog.ceo
