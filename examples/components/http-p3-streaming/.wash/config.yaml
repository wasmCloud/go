build:
  # GOFLAGS selects go.bytecodealliance.org/pkg/wasihttp's async WASI P3
  # implementation. componentize-go emits the componentizego_async tag on its
  # own for async worlds since bytecodealliance/componentize-go#71, but the
  # `go tool` wrapper hard-codes `release := "v0.4.1"` and so always fetches
  # the v0.4.1 binary, which predates it. Drop the env prefix once a release
  # after v0.4.1 ships and the wrapper points at it.
  command: GOFLAGS=-tags=componentizego_async go tool componentize-go -w wasmcloud:component-go/wasip3@0.2.0 build -o build/http_p3_streaming.wasm
  component_path: build/http_p3_streaming.wasm
workload:
  allowedHosts:
    - dog.ceo
