# Deploys the processor on wasmCloud v2. Needs a runtime >= 2.7.0: this
# manifest uses `maxConcurrency`, which 2.6.x rejects outright.
#
#   kubectl apply -f deployment.yaml
#
# The grants are not here on purpose. Under `wash host`'s default
# `--wasmcloud-nats-workload-config=deny`, `subject-allow`, `stream-allow`,
# `bucket-allow`, `servers`, credentials, and TLS are the host's to declare;
# a manifest that sets one is refused at bind. What stays here is what this
# workload wants delivered within that grant. See "Declaring the binding
# host-side" in the README for the operator half.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: nats-jetstream-orders
spec:
  replicas: 1
  template:
    spec:
      components:
        - name: processor
          image: ghcr.io/[your-org]/nats-jetstream-orders:0.1.0
          maxConcurrency: 4
          poolSize: 1
      hostInterfaces:
        - namespace: wasmcloud
          package: nats
          version: "0.1.0"
          interfaces: [types, jetstream, kv, jetstream-handler]
          config:
            # STREAM:filter[:policy[:queue]]. An ask, not a grant: the host
            # has already granted `ORDERS` and the subject `orders.received`,
            # and this says which of that reach to actually deliver. The
            # filter is still checked against the host's subject grant when
            # the consumer is created, so a filter reaching past it fails the
            # deployment rather than quietly widening it.
            subscriptions: ORDERS:orders.received:all
            # The host acks on a nil return and naks on an error.
            ack-mode: auto
            max-in-flight: "8"
