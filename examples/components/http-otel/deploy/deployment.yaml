apiVersion: v1
kind: Service
metadata:
  name: http-otel
spec:
  type: NodePort
  ports:
    # The port must be named `http`: the operator writes this selectorless
    # Service's EndpointSlices with a port named `http`, and Kubernetes
    # matches slice ports to Service ports by name. Unnamed, nothing routes.
    - name: http
      port: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: http-otel
spec:
  replicas: 1
  template:
    spec:
      hostSelector:
        hostgroup: default
      kubernetes:
        service:
          name: http-otel
      components:
        - name: http-otel
          image: ghcr.io/[your-org]/http-otel:0.1.0
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: localhost
        - namespace: wasi
          package: otel
          interfaces:
            - types
            - tracing
