# Deploys the reader on wasmCloud v2. Needs a runtime >= 2.7.0: this
# manifest uses `maxConcurrency`, which 2.6.x rejects outright.
#
#   kubectl apply -f deployment.yaml
#
# The stream and subject grants are not here on purpose. Under a `wash host`
# plugin entry's default `workloadConfig: deny` they are the host's to
# declare, and a manifest that sets one is refused at bind. See "Declaring
# the binding host-side" in the README for the operator half.
apiVersion: v1
kind: Service
metadata:
  name: nats-stream-replay
spec:
  type: NodePort
  ports:
    - port: 80
      protocol: TCP
---
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: nats-stream-replay
spec:
  replicas: 1
  template:
    spec:
      kubernetes:
        service:
          name: nats-stream-replay
      components:
        - name: reader
          image: ghcr.io/[your-org]/nats-stream-replay:0.1.0
          maxConcurrency: 4
          poolSize: 1
      hostInterfaces:
        # wasi:logging is a host plugin like any other: a component that
        # imports it and does not declare it here fails to start with
        # "a matching implementation was not found in the linker". `wash
        # dev` derives this entry from the component's imports, so the
        # omission only shows up on a real host.
        - namespace: wasi
          package: logging
          interfaces: [logging]
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            # The host routes incoming requests by `Host` header, and the
            # table is keyed by hostname across every workload on the host —
            # two workloads naming the same host become replicas of one
            # route and split its traffic at random. Name the Service, not
            # `localhost`, so co-deployed examples do not steal each other's
            # requests.
            host: nats-stream-replay
        - namespace: wasmcloud
          package: nats
          version: "0.1.0"
          # No handler interface: this component is driven by HTTP, so the
          # host pushes nothing at it and there are no subscriptions to
          # declare.
          interfaces: [types, jetstream]
          # No `config` at all, and that is the whole shape of this example
          # under `deny`: every stream and subject this component reads is
          # the host's to grant, and the component asks for nothing to be
          # pushed at it. A request for a stream outside the host's
          # `stream-allow` still fails host-side and comes back as a 403
          # without reaching the server — the grant just lives elsewhere now.
